// ================= 拡大写真機能（完全リライト版） =================
let currentOverlay = null;
let zoomState = {
  scale: 1,
  posX: 0,
  posY: 0,
  lastTouchDistance: 0,
  lastTouchCenter: { x: 0, y: 0 }
};

function openOverlay(src) {
  closeOverlay();
  
  currentOverlay = document.createElement('div');
  currentOverlay.className = 'overlay';
  currentOverlay.setAttribute('role', 'dialog');
  currentOverlay.setAttribute('aria-modal', 'true');
  currentOverlay.setAttribute('aria-label', '拡大画像');
  
  // ズーム状態をリセット
  resetZoomState();
  
  currentOverlay.innerHTML = `
    <div class="zoom-indicator" id="zoomIndicator">100%</div>
    <div class="overlay-content">
      <div class="overlay-image-container" id="imageContainer">
        <img src="${src}" class="overlay-image" alt="作業の参考写真（拡大表示）" 
             id="overlayImage" onload="initImageControls()">
      </div>
    </div>
    <div class="overlay-controls">
      <button class="overlay-btn" onclick="zoomOut()" aria-label="縮小">
        <span>➖</span> 縮小
      </button>
      <button class="overlay-btn" onclick="resetZoom()" aria-label="リセット">
        <span>🔄</span> リセット
      </button>
      <button class="overlay-btn" onclick="zoomIn()" aria-label="拡大">
        <span>➕</span> 拡大
      </button>
    </div>
    <button class="close-overlay-btn" onclick="closeOverlay()" aria-label="閉じる">
      ×<br><small>とじる</small>
    </button>
  `;

  document.body.appendChild(currentOverlay);
  document.documentElement.style.overflow = 'hidden';
  document.body.style.overflow = 'hidden';
  
  setTimeout(() => {
    currentOverlay.classList.add('active');
    const closeBtn = currentOverlay.querySelector('.close-overlay-btn');
    if (closeBtn) closeBtn.focus();
  }, 10);
  
  // 背景クリックで閉じる
  currentOverlay.addEventListener('click', function(e) {
    if (e.target === this || e.target.classList.contains('overlay-content')) {
      closeOverlay();
    }
  });
  
  // キーボードイベント
  const keyHandler = function(e) {
    if (e.key === 'Escape') {
      closeOverlay();
    }
  };
  document.addEventListener('keydown', keyHandler);
  
  // 後片付け用に保存
  currentOverlay._keyHandler = keyHandler;
  
  return false;
}

function initImageControls() {
  const imgElement = document.getElementById('overlayImage');
  const container = document.getElementById('imageContainer');
  if (!imgElement || !container) return;
  
  // マウスホイールズーム（PC）
  container.addEventListener('wheel', function(e) {
    e.preventDefault();
    const delta = e.deltaY > 0 ? 0.9 : 1.1;
    
    // マウス位置を中心にズーム
    const rect = imgElement.getBoundingClientRect();
    const mouseX = e.clientX - rect.left;
    const mouseY = e.clientY - rect.top;
    
    const oldScale = zoomState.scale;
    const newScale = Math.max(1, Math.min(5, zoomState.scale * delta));
    
    // マウス位置を中心にズーム
    zoomState.posX = mouseX / newScale - mouseX / oldScale + zoomState.posX;
    zoomState.posY = mouseY / newScale - mouseY / oldScale + zoomState.posY;
    zoomState.scale = newScale;
    
    updateImageTransform();
  }, { passive: false });
  
  // タッチイベント（スマホ）
  let isDragging = false;
  let lastTouchX = 0;
  let lastTouchY = 0;
  let touchStartX = 0;
  let touchStartY = 0;
  let startPosX = 0;
  let startPosY = 0;
  let isPinching = false;
  let initialPinchDistance = 0;
  let initialScale = 1;
  
  container.addEventListener('touchstart', function(e) {
    e.preventDefault();
    
    if (e.touches.length === 1) {
      // 1本指タッチ：ドラッグ開始
      isDragging = true;
      isPinching = false;
      
      const touch = e.touches[0];
      lastTouchX = touch.clientX;
      lastTouchY = touch.clientY;
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
      startPosX = zoomState.posX;
      startPosY = zoomState.posY;
      
      imgElement.classList.add('dragging');
    } else if (e.touches.length === 2) {
      // 2本指タッチ：ピンチズーム開始
      isDragging = false;
      isPinching = true;
      
      const touch1 = e.touches[0];
      const touch2 = e.touches[1];
      
      // 初期距離を計算
      initialPinchDistance = Math.sqrt(
        Math.pow(touch2.clientX - touch1.clientX, 2) +
        Math.pow(touch2.clientY - touch1.clientY, 2)
      );
      
      initialScale = zoomState.scale;
      
      // ピンチ中心を計算
      const centerX = (touch1.clientX + touch2.clientX) / 2;
      const centerY = (touch1.clientY + touch2.clientY) / 2;
      const rect = imgElement.getBoundingClientRect();
      
      zoomState.lastTouchCenter = {
        x: centerX - rect.left,
        y: centerY - rect.top
      };
    }
  });
  
  container.addEventListener('touchmove', function(e) {
    e.preventDefault();
    
    if (isDragging && e.touches.length === 1) {
      // 1本指ドラッグ
      const touch = e.touches[0];
      const deltaX = touch.clientX - lastTouchX;
      const deltaY = touch.clientY - lastTouchY;
      
      lastTouchX = touch.clientX;
      lastTouchY = touch.clientY;
      
      // 拡大時のみ移動可能
      if (zoomState.scale > 1) {
        zoomState.posX += deltaX / zoomState.scale;
        zoomState.posY += deltaY / zoomState.scale;
        applyBoundaryConstraints();
        updateImageTransform();
      }
    } else if (isPinching && e.touches.length === 2) {
      // 2本指ピンチズーム
      const touch1 = e.touches[0];
      const touch2 = e.touches[1];
      
      // 現在の距離を計算
      const currentDistance = Math.sqrt(
        Math.pow(touch2.clientX - touch1.clientX, 2) +
        Math.pow(touch2.clientY - touch1.clientY, 2)
      );
      
      if (initialPinchDistance > 0) {
        // スケール計算
        const scale = initialScale * (currentDistance / initialPinchDistance);
        const newScale = Math.max(1, Math.min(5, scale));
        
        // ピンチ中心を維持
        if (zoomState.lastTouchCenter) {
          const centerX = zoomState.lastTouchCenter.x;
          const centerY = zoomState.lastTouchCenter.y;
          
          zoomState.posX = centerX / newScale - centerX / zoomState.scale + zoomState.posX;
          zoomState.posY = centerY / newScale - centerY / zoomState.scale + zoomState.posY;
        }
        
        zoomState.scale = newScale;
        applyBoundaryConstraints();
        updateImageTransform();
      }
    }
  });
  
  container.addEventListener('touchend', function(e) {
    if (e.touches.length === 0) {
      isDragging = false;
      isPinching = false;
      imgElement.classList.remove('dragging');
      
      // ドラッグが最小移動だった場合はダブルタップ判定
      const touchEndX = e.changedTouches[0].clientX;
      const touchEndY = e.changedTouches[0].clientY;
      const moveDistance = Math.sqrt(
        Math.pow(touchEndX - touchStartX, 2) +
        Math.pow(touchEndY - touchStartY, 2)
      );
      
      if (moveDistance < 10) {
        handleTap();
      }
    } else if (e.touches.length === 1) {
      // 2本指から1本指になった場合
      isPinching = false;
      const touch = e.touches[0];
      lastTouchX = touch.clientX;
      lastTouchY = touch.clientY;
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
      startPosX = zoomState.posX;
      startPosY = zoomState.posY;
      isDragging = true;
    }
  });
  
  // ダブルタップ処理
  let lastTapTime = 0;
  function handleTap() {
    const currentTime = new Date().getTime();
    const tapLength = currentTime - lastTapTime;
    
    if (tapLength < 300 && tapLength > 0) {
      // ダブルタップ
      if (zoomState.scale === 1) {
        // ズームイン（2.5倍）
        const rect = imgElement.getBoundingClientRect();
        const tapX = (touchStartX - rect.left);
        const tapY = (touchStartY - rect.top);
        
        const newScale = 2.5;
        zoomState.posX = tapX / newScale - tapX / zoomState.scale + zoomState.posX;
        zoomState.posY = tapY / newScale - tapY / zoomState.scale + zoomState.posY;
        zoomState.scale = newScale;
      } else {
        // ズームアウト（リセット）
        resetZoomState();
      }
      
      applyBoundaryConstraints();
      updateImageTransform();
      lastTapTime = 0;
    } else {
      lastTapTime = currentTime;
    }
  }
}

function applyBoundaryConstraints() {
  const imgElement = document.getElementById('overlayImage');
  if (!imgElement) return;
  
  const container = imgElement.parentElement;
  const imgWidth = imgElement.naturalWidth || imgElement.width;
  const imgHeight = imgElement.naturalHeight || imgElement.height;
  
  if (imgWidth === 0 || imgHeight === 0) return;
  
  const scaledWidth = imgWidth * zoomState.scale;
  const scaledHeight = imgHeight * zoomState.scale;
  const containerWidth = container.clientWidth;
  const containerHeight = container.clientHeight;
  
  // X方向の制限
  if (scaledWidth > containerWidth) {
    const maxX = (scaledWidth - containerWidth) / (2 * zoomState.scale);
    zoomState.posX = Math.max(-maxX, Math.min(maxX, zoomState.posX));
  } else {
    zoomState.posX = 0;
  }
  
  // Y方向の制限
  if (scaledHeight > containerHeight) {
    const maxY = (scaledHeight - containerHeight) / (2 * zoomState.scale);
    zoomState.posY = Math.max(-maxY, Math.min(maxY, zoomState.posY));
  } else {
    zoomState.posY = 0;
  }
}

function updateImageTransform() {
  const imgElement = document.getElementById('overlayImage');
  const indicator = document.getElementById('zoomIndicator');
  
  if (imgElement) {
    imgElement.style.transform = 
      `translate(${zoomState.posX * zoomState.scale}px, ${zoomState.posY * zoomState.scale}px) scale(${zoomState.scale})`;
  }
  
  if (indicator) {
    const percentage = Math.round(zoomState.scale * 100);
    indicator.textContent = `${percentage}%`;
    indicator.style.display = 'block';
    
    clearTimeout(indicator.hideTimeout);
    indicator.hideTimeout = setTimeout(() => {
      indicator.style.display = 'none';
    }, 2000);
  }
}

function resetZoomState() {
  zoomState = {
    scale: 1,
    posX: 0,
    posY: 0,
    lastTouchDistance: 0,
    lastTouchCenter: { x: 0, y: 0 }
  };
}

function zoomIn() {
  const imgElement = document.getElementById('overlayImage');
  if (!imgElement) return;
  
  const newScale = Math.min(5, zoomState.scale * 1.3);
  
  // 中心を維持
  const container = imgElement.parentElement;
  const containerWidth = container.clientWidth;
  const containerHeight = container.clientHeight;
  
  const centerX = -zoomState.posX * zoomState.scale + containerWidth / 2;
  const centerY = -zoomState.posY * zoomState.scale + containerHeight / 2;
  
  zoomState.posX = centerX / newScale - centerX / zoomState.scale + zoomState.posX;
  zoomState.posY = centerY / newScale - centerY / zoomState.scale + zoomState.posY;
  zoomState.scale = newScale;
  
  applyBoundaryConstraints();
  updateImageTransform();
}

function zoomOut() {
  const imgElement = document.getElementById('overlayImage');
  if (!imgElement) return;
  
  const newScale = Math.max(1, zoomState.scale * 0.7);
  
  // 中心を維持
  const container = imgElement.parentElement;
  const containerWidth = container.clientWidth;
  const containerHeight = container.clientHeight;
  
  const centerX = -zoomState.posX * zoomState.scale + containerWidth / 2;
  const centerY = -zoomState.posY * zoomState.scale + containerHeight / 2;
  
  zoomState.posX = centerX / newScale - centerX / zoomState.scale + zoomState.posX;
  zoomState.posY = centerY / newScale - centerY / zoomState.scale + zoomState.posY;
  zoomState.scale = newScale;
  
  applyBoundaryConstraints();
  updateImageTransform();
}

function resetZoom() {
  resetZoomState();
  updateImageTransform();
}

function closeOverlay() {
  if (!currentOverlay) return;
  
  currentOverlay.classList.remove('active');
  
  setTimeout(() => {
    if (currentOverlay && currentOverlay.parentNode) {
      // イベントリスナーを削除
      if (currentOverlay._keyHandler) {
        document.removeEventListener('keydown', currentOverlay._keyHandler);
      }
      
      currentOverlay.parentNode.removeChild(currentOverlay);
    }
    currentOverlay = null;
    
    document.documentElement.style.overflow = '';
    document.body.style.overflow = '';
  }, 300);
}

// ================= 進捗管理（変更なし） =================
let completedCounts = [0, 0, 0, 0, 0, 0];
let currentStep = 0;

function saveProgress() {
  localStorage.setItem('simple_progress', JSON.stringify({
    counts: completedCounts,
    lastStep: currentStep,
    timestamp: Date.now()
  }));
}

function loadProgress() {
  const saved = JSON.parse(localStorage.getItem('simple_progress'));
  if (saved && saved.counts) {
    completedCounts = saved.counts;
    currentStep = saved.lastStep || 0;
  }
}

function kidComplete(stepIndex) {
  if (completedCounts[stepIndex] < 4) {
    completedCounts[stepIndex]++;
    
    if ('vibrate' in navigator) navigator.vibrate(100);
    
    saveProgress();
    updateProgressDisplay();
    renderStepView(steps[currentStep]);
    
    if (completedCounts[stepIndex] === 4) {
      celebrateAllComplete(stepIndex);
    }
  }
}

function initOrientationLock() {
  window.addEventListener('orientationchange', checkOrientation);
  window.addEventListener('resize', checkOrientation);
  checkOrientation();
}

function checkOrientation() {
  const isPortrait = window.innerHeight > window.innerWidth;
  const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  
  if (isMobile && !isPortrait) {
    rotationWarning.classList.add('active');
  } else {
    rotationWarning.classList.remove('active');
  }
}
