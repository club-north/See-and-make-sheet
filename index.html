<header class="header">
  <h1>👀みてつくるシート🚗</h1>
  <p>工作の手順を確認しながら、作った作品をアルバムに残そう！</p>

<div class="progress-container" id="progressBarContainer">
  <div class="progress-bar" id="progressBar"></div>

<div class="nav-container">
  <div class="nav-scroll" id="navButtons"></div>
</div>

<!-- 変更1: 指導員用パネル - 二段階確定方式に変更 -->
<div class="teacher-panel" id="teacherPanel">
  <div class="teacher-content">
    <h3>👨‍🏫 指導員用管理パネル</h3>
    
    <!-- 確認エリア（追加） -->
    <div id="confirmationArea" style="display: none;"></div>
    
    <!-- 変更2: スライダー方式に変更 -->
    <div class="teacher-section">
      <h4>現在の工程を調整</h4>
      <p id="currentStepInfo"></p>
      <div class="counter-control">
        <div style="display: flex; align-items: center; gap: 15px; width: 100%;">
          <span style="font-size: 1.2rem; min-width: 60px;">0人</span>
          <input type="range" id="countSlider" min="0" max="4" 
                 style="flex: 1; height: 30px; -webkit-appearance: none; background: #e0e0e0; border-radius: 15px;"
                 oninput="updateSliderDisplay(this.value)">
          <span style="font-size: 1.2rem; min-width: 60px;">4人</span>
        </div>
        <div id="sliderValue" style="text-align: center; font-size: 1.8rem; margin: 15px 0; font-weight: bold; color: #2196F3;">
          <!-- JavaScriptで動的に表示 -->
        </div>
        <div style="display: flex; gap: 10px; margin-top: 10px;">
          <button onclick="applySliderChange()" style="background: #4CAF50; color: white; border: none; padding: 10px 20px; border-radius: 8px; flex: 1; font-weight: bold;">
            ✅ 確定
          </button>
          <button onclick="cancelSliderChange()" style="background: #ccc; color: #333; border: none; padding: 10px 20px; border-radius: 8px; flex: 1;">
            キャンセル
          </button>
        </div>
      </div>
    </div>
    
    <!-- 全工程の一括管理 -->
    <div class="teacher-section">
      <h4>全工程の進捗</h4>
      <table class="progress-table" id="allStepsTable">
        <!-- JavaScriptで動的に生成 -->
      </table>
      <div style="margin-top: 15px; text-align: center;">
        <button onclick="applyAllChanges()" style="background: #4CAF50; color: white; border: none; padding: 10px 20px; border-radius: 8px; width: 100%; font-weight: bold;">
          ✅ 一括変更を確定
        </button>
      </div>
    </div>
    
    <!-- データ管理 -->
    <div class="teacher-section">
      <h4>データ管理</h4>
      <div style="display: flex; gap: 10px; flex-wrap: wrap;">
        <button onclick="saveAllProgress()" style="background:#4CAF50; color:white; border:none; padding:10px; border-radius:6px; flex:1;">
          💾 保存
        </button>
        <button onclick="resetAllProgress()" style="background:#f44336; color:white; border:none; padding:10px; border-radius:6px; flex:1;">
          🔥 全リセット
        </button>
        <button onclick="exportProgress()" style="background:#2196F3; color:white; border:none; padding:10px; border-radius:6px; flex:1;">
          📤 エクスポート
        </button>
      </div>
    </div>
    
    <!-- 終了ボタン -->
    <div style="text-align:center; margin-top:20px;">
      <button onclick="hideTeacherPanel()" class="close-btn">
        閉じる
      </button>
      <p style="font-size:0.8rem; color:#666; margin-top:10px;">
        隠し機能：進捗バーを3秒長押し→ダブルタップ
      </p>
    </div>
  </div>
</div>

</div>

];

// 各工程の目安時間（分）
const stepTimes = {
  0: 20, 1: 30, 2: 30, 3: 20, 4: 40, 5: 30
};

// 超シンプルな進捗管理
let completedCounts = [0, 0, 0, 0, 0, 0];
let currentStep = 0;

// 指導員用隠し機能の状態管理
let teacherLongPressTimer = null;
let teacherTapCount = 0;
let teacherDoubleTapTimer = null;

// 拡大写真の状態管理
let currentOverlay = null;
let overlayKeydownHandler = null;

// 指導員用変更管理（追加）
let pendingSliderValue = null;
let pendingTableChanges = {};

const navButtons = document.getElementById('navButtons');
const content = document.getElementById('content');
const rotationWarning = document.getElementById('rotationWarning');
const progressBar = document.getElementById('progressBar');
const progressBarContainer = document.getElementById('progressBarContainer');
const teacherPanel = document.getElementById('teacherPanel');

// ================= 優先度1: 写真拡大機能の修正 =================
function openOverlay(src) {
  console.log('写真拡大を開きます:', src);
  
  // 画像パスの確認とデバッグ
  if (!src || src.trim() === '') {
    console.error('画像パスが空です');
    alert('画像が見つかりません');
    return false;
  }
  
  // 画像読み込みテスト
  const testImg = new Image();
  testImg.onload = () => console.log('✅ 画像読み込み成功:', src);
  testImg.onerror = () => {
    console.error('❌ 画像読み込み失敗:', src);
    alert('写真を読み込めませんでした\n別の写真を試してください');
    return false;
  };
  testImg.src = src;
  
  // 既存のオーバーレイを閉じる
  closeOverlay();
  
  // 新しいオーバーレイを作成
  currentOverlay = document.createElement('div');
  currentOverlay.className = 'overlay';
  currentOverlay.setAttribute('role', 'dialog');
  currentOverlay.setAttribute('aria-modal', 'true');
  currentOverlay.setAttribute('aria-label', '拡大画像');
  
  currentOverlay.innerHTML = `
    <div class="overlay-content">
      <img src="${src}" class="overlay-image" alt="作業の参考写真（拡大表示）" 
           onerror="this.onerror=null; this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📷</text></svg>'; this.alt=%22画像を読み込めませんでした%22; alert(%22写真を読み込めませんでした%22);">
    </div>
    <button class="close-overlay-btn" onclick="closeOverlay()" aria-label="閉じる">
      ×<br><small>とじる</small>
    </button>
  `;

  // bodyに追加
  document.body.appendChild(currentOverlay);
  
  // スクロールを無効化
  document.documentElement.style.overflow = 'hidden';
  document.body.style.overflow = 'hidden';
  
  // アニメーションを開始
  setTimeout(() => {
    currentOverlay.classList.add('active');
    // 閉じるボタンにフォーカスを移動
    const closeBtn = currentOverlay.querySelector('.close-overlay-btn');
    if (closeBtn) closeBtn.focus();
  }, 10);
  
  // オーバーレイ背景クリックで閉じる
  currentOverlay.addEventListener('click', function(e) {
    if (e.target === this || e.target.classList.contains('overlay-content')) {
      closeOverlay();
    }
  });
  
  // ESCキーで閉じる
  overlayKeydownHandler = function(e) {
    if (e.key === 'Escape') {
      closeOverlay();
    }
  };
  document.addEventListener('keydown', overlayKeydownHandler);
  
  // タッチデバイスでピンチズームを防止
  currentOverlay.addEventListener('touchmove', function(e) {
    if (e.touches.length > 1) {
      e.preventDefault();
    }
  }, { passive: false });
  
  return false;
}

function closeOverlay() {
  if (!currentOverlay) return;
  
  // アニメーションのためにactiveクラスを削除
  currentOverlay.classList.remove('active');
  
  // アニメーション終了後に完全に削除
  setTimeout(() => {
    if (currentOverlay && currentOverlay.parentNode) {
      currentOverlay.parentNode.removeChild(currentOverlay);
    }
    currentOverlay = null;
    
    // スクロールを有効化
    document.documentElement.style.overflow = '';
    document.body.style.overflow = '';
    
    // イベントリスナーを削除
    if (overlayKeydownHandler) {
      document.removeEventListener('keydown', overlayKeydownHandler);
      overlayKeydownHandler = null;
    }
  }, 300);
}

function createPhotoElement(imgSrc, altText) {
  // デバッグ用のイベントハンドラを追加
  return `
    <div class="photo-container" onclick="console.log('写真タップ:', '${imgSrc}'); openOverlay('${imgSrc}'); return false;" 
         style="cursor: pointer; position: relative;">
      <img src="${imgSrc}" class="step-image" alt="${altText}" loading="lazy"
           onerror="console.error('画像読み込みエラー:', '${imgSrc}'); this.style.display='none'; this.nextElementSibling.textContent='写真を読み込めません'"
           style="cursor: pointer;">
      <div class="tap-label">タップで拡大</div>
    </div>
  `;
}

// ================= 優先度2: 子ども用完了機能の簡素化 =================
function kidComplete(stepIndex) {
  if (completedCounts[stepIndex] < 4) {
    completedCounts[stepIndex]++;
    
    // 視覚的フィードバック
    const button = document.querySelector('.big-kids-button');
    if (button) {
      button.style.transform = 'scale(0.95)';
      button.style.opacity = '0.9';
      setTimeout(() => { 
        button.style.transform = 'scale(1)';
        button.style.opacity = '1';
      }, 150);
    }
    
    // 音声フィードバック（可能なら）
    try {
      const audio = new Audio('data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEAQB8AAEAfAAABAAgAZGF0YQ');
      audio.play().catch(() => {});
    } catch(e) {}
    
    // 保存して表示を更新
    saveProgress();
    updateProgressDisplay();
    renderStepView(steps[currentStep]);
    
    // 全員完了の祝い
    if (completedCounts[stepIndex] === 4) {
      celebrateAllComplete(stepIndex);
    }
  }
}

function celebrateAllComplete(stepIndex) {
  const message = document.querySelector('.all-complete-message');
  if (message) {
    message.style.animation = 'celebrate 0.5s ease';
    setTimeout(() => {
      message.style.animation = 'gentlePulse 2s infinite';
    }, 500);
  }
  
  // バイブレーション（可能なら）
  if ('vibrate' in navigator) {
    navigator.vibrate([100, 50, 100]);
  }
}

// ================= 優先度3: 指導員用管理パネルの改善 =================
function showTeacherPanel() {
  updateTeacherPanel();
  teacherPanel.classList.add('active');
  
  // スライダーを現在の値に設定
  const slider = document.getElementById('countSlider');
  if (slider) {
    slider.value = completedCounts[currentStep];
    updateSliderDisplay(completedCounts[currentStep]);
  }
  
  // 未確定の変更をリセット
  pendingSliderValue = null;
  pendingTableChanges = {};
}

function updateSliderDisplay(value) {
  const display = document.getElementById('sliderValue');
  if (display) {
    const current = completedCounts[currentStep];
    if (value != current) {
      display.innerHTML = `<span style="color: #FF9800;">${current} → ${value}</span>/4人`;
      pendingSliderValue = parseInt(value);
    } else {
      display.textContent = `${value}/4人`;
      pendingSliderValue = null;
    }
  }
}

function applySliderChange() {
  if (pendingSliderValue !== null) {
    const oldValue = completedCounts[currentStep];
    completedCounts[currentStep] = pendingSliderValue;
    pendingSliderValue = null;
    
    updateTeacherPanel();
    render();
    
    // 変更の視覚的フィードバック
    const sliderValue = document.getElementById('sliderValue');
    if (sliderValue) {
      sliderValue.style.color = '#4CAF50';
      sliderValue.textContent = `${completedCounts[currentStep]}/4人`;
      setTimeout(() => sliderValue.style.color = '#2196F3', 1000);
    }
  }
}

function cancelSliderChange() {
  const slider = document.getElementById('countSlider');
  if (slider) {
    slider.value = completedCounts[currentStep];
    updateSliderDisplay(completedCounts[currentStep]);
  }
  pendingSliderValue = null;
}

// テーブル変更の管理
function handleTableChange(stepIndex, value) {
  const currentValue = completedCounts[stepIndex];
  const newValue = parseInt(value);
  
  if (newValue !== currentValue) {
    pendingTableChanges[stepIndex] = newValue;
  } else {
    delete pendingTableChanges[stepIndex];
  }
  
  // ボタンの状態を更新
  const applyBtn = document.querySelector('button[onclick="applyAllChanges()"]');
  if (applyBtn) {
    const changeCount = Object.keys(pendingTableChanges).length;
    if (changeCount > 0) {
      applyBtn.textContent = `✅ ${changeCount}件の変更を確定`;
      applyBtn.style.background = 'linear-gradient(135deg, #FF9800, #F57C00)';
    } else {
      applyBtn.textContent = '✅ 一括変更を確定';
      applyBtn.style.background = '#4CAF50';
    }
  }
}

function applyAllChanges() {
  const changeCount = Object.keys(pendingTableChanges).length;
  if (changeCount === 0) return;
  
  // 変更内容を表示
  let changeLog = '以下の変更を適用します：\n\n';
  for (const [stepIndex, newValue] of Object.entries(pendingTableChanges)) {
    const stepName = steps[stepIndex].nav;
    const oldValue = completedCounts[stepIndex];
    changeLog += `工程 ${stepName}: ${oldValue} → ${newValue}/4人\n`;
  }
  
  if (confirm(changeLog + '\nこの変更を適用してもよろしいですか？')) {
    // 変更を適用
    for (const [stepIndex, newValue] of Object.entries(pendingTableChanges)) {
      completedCounts[stepIndex] = newValue;
    }
    
    // リセット
    pendingTableChanges = {};
    updateTeacherPanel();
    render();
    
    alert(`${changeCount}件の変更を適用しました！`);
  }
}

// ================= その他の必要な関数（修正版） =================
function updateTeacherPanel() {
  // 現在の工程情報
  document.getElementById('currentStepInfo').textContent = 
    `工程 ${currentStep + 1}: ${steps[currentStep].title}`;
  
  // 全工程テーブルを更新
  const table = document.getElementById('allStepsTable');
  table.innerHTML = steps.map((step, i) => {
    if (step.isAlbum) return '';
    const count = completedCounts[i];
    return `
      <tr>
        <td>${step.nav}</td>
        <td>
          <select onchange="handleTableChange(${i}, this.value)" style="width:100%; padding:8px; border-radius:6px; border:1px solid #ccc;">
            <option value="0" ${count===0?'selected':''}>0人</option>
            <option value="1" ${count===1?'selected':''}>1人</option>
            <option value="2" ${count===2?'selected':''}>2人</option>
            <option value="3" ${count===3?'selected':''}>3人</option>
            <option value="4" ${count===4?'selected':''}>4人</option>
          </select>
        </td>
      </tr>
    `;
  }).join('');
}

// ================= 子ども用完了エリア表示（簡素化版） =================
function renderKidsCompleteArea(stepIndex) {
  if (steps[stepIndex].isAlbum) return '';
  
  const count = completedCounts[stepIndex];
  const percentage = Math.round((count / 4) * 100);
  const isAllComplete = count === 4;
  
  return `
    <div class="kids-complete-area">
      <div class="kids-title">
        <span>🎯</span>
        <span>できたら押そう！</span>
        <span>🎯</span>
      </div>
      
      <button class="big-kids-button" onclick="kidComplete(${stepIndex})" 
              ${isAllComplete ? 'disabled style="opacity:0.7; cursor:default;"' : ''}>
        <span class="big-emoji">${isAllComplete ? '🎉' : '✅'}</span>
        <span class="big-text">${isAllComplete ? '全員完了！' : 'できました！'}</span>
      </button>
      
      <div class="completion-counter">
        <div class="counter-display">
          ${count === 4 ? '🎉 全員完了！' : `${count}/4人 完了`}
        </div>
        <div class="counter-bar">
          <div class="counter-fill" style="width: ${percentage}%"></div>
        </div>
        <p style="color: #666; margin-top: 5px; font-size: 0.9rem;">
          ${count === 0 ? 'まだ誰も押していません' : 
            count < 4 ? `あと${4 - count}人で全員完了！` : 
            'みんなよくできました！'}
        </p>
      </div>
      
      ${isAllComplete ? renderAllCompleteMessage(stepIndex) : ''}
      
      <div class="teacher-note">
        <strong>👨‍🏫 指導員用メモ：</strong><br>
        1. まず写真を見せて完成イメージを共有しましょう<br>
        2. 写真を見ながら工作を進めさせてください<br>
        3. 完成したら「できました！」ボタンを押させてください<br>
        4. 間違えた場合は指導員パネルで修正してください<br>
        5. 全員が押すと次の工程に進めます
      </div>
    </div>
  `;
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeOverlay();

      hideTeacherPanel();
